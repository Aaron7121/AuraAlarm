name: Publicar versión

# Sube una etiqueta "vX.Y.Z" (igual al versionName de app/build.gradle.kts) y este flujo
# compila el APK y crea el release con el archivo listo para descargar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con la versión de la app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts \
            || { echo "La etiqueta $GITHUB_REF_NAME no coincide con versionName en app/build.gradle.kts"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests y APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="AuraAlarm-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "AuraAlarm ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
